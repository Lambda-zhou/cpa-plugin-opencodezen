name: Build zen plugin (Windows)

# Builds the zen plugin for Windows (amd64) and uploads the build
# artifact (no GitHub Release, since main pushes have no tag):
#
#   zen_<version>_windows_amd64.zip   (zip root contains zen.dll)
#   checksums-windows.txt             (sha256sum format)
#
# Trigger: every push to main (no manual tag needed). Can also be
# triggered manually from the Actions tab (workflow_dispatch).
# This workflow is Windows-only. The companion linux release stays in
# release.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build zen.dll (Windows)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # windows-2025 runner ships mingw-w64 gcc 15.2.0 in PATH (MSYS2).
      # Verify it is reachable so CGO_ENABLED=1 can link the c-shared DLL.
      - name: Check C toolchain
        shell: pwsh
        run: |
          gcc --version
          go env CGO_ENABLED GOOS GOARCH

      - name: Vet & Test
        run: |
          go mod tidy
          go mod verify
          go vet ./...

      # Version = short commit hash. On main pushes GITHUB_REF_NAME is
      # "main", not a tag, so use the commit SHA (first 7 chars) to keep
      # every build's asset name unique.
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = $env:GITHUB_SHA.Substring(0, 7)
          Write-Output "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "dist/windows_amd64" | Out-Null
          go build -trimpath -buildvcs=true -buildmode=c-shared `
            -ldflags "-s -w -X main.pluginVersion=$ver" `
            -o "dist/windows_amd64/zen.dll" .
          Remove-Item -Force "dist/windows_amd64/zen.h" -ErrorAction SilentlyContinue

      - name: Package zip (store layout)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item "dist/windows_amd64/zen.dll" "stage/zen.dll"
          Compress-Archive -Path "stage/zen.dll" -DestinationPath "zen_${ver}_windows_amd64.zip" -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 -Path "zen_*.zip" |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path "checksums-windows.txt" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen-windows-amd64
          path: |
            zen_*.zip
            checksums-windows.txt
          if-no-files-found: error